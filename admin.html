<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA SHOP · Admin</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--ink:#17211e;--muted:#7a8580;--line:#e7ece8;--bg:#f5f7f5;--green:#194f3b;--light:#e8f3ec;--shadow:0 14px 40px #233e3210}
*{box-sizing:border-box}body{font:14px/1.6 'DM Sans',Arial,sans-serif;background:var(--bg);color:var(--ink);margin:0;min-height:100vh;padding:0 30px 65px 302px}h1,h2,h3{font-family:Manrope,Arial,sans-serif;letter-spacing:-.045em}h1{font-size:29px;margin:0 0 4px;font-weight:800}h2{font-size:23px;margin:0 0 22px}button,input,select,textarea{font:inherit}button{cursor:pointer;transition:.2s}button:hover{filter:brightness(.95);transform:translateY(-1px)}input,select,textarea{width:100%;max-width:100%;background:#fff;border:1px solid #dce4dd;border-radius:11px;padding:13px 15px;outline:0;color:var(--ink)}input:focus,select:focus,textarea:focus{border-color:#2b7452;box-shadow:0 0 0 3px #2b74521a}textarea{resize:vertical}input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);vertical-align:middle;margin-right:9px}form{display:grid;gap:15px;max-width:none}form label{display:block;font-weight:600;font-size:12px;color:#55665b}form label input,form label textarea{margin-top:7px;font-weight:400}form button,.row button,.order button{background:var(--green);border:0;border-radius:10px;padding:13px 19px;color:white;font-weight:700}form button[type=button]{background:#eaf0eb;color:var(--green)}#panel{display:none}#msg{min-height:22px;color:#25714d;font-weight:600;font-size:13px;margin:16px 0 25px}body>h1{padding-top:38px}body>.muted{margin-top:0}#panel>nav{position:fixed;top:0;left:0;bottom:0;width:266px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px;padding:122px 15px 25px;margin:0;z-index:5}#panel>nav:before{content:'NOVA / CONTROL';position:absolute;top:45px;left:27px;font-family:Manrope;font-weight:800;font-size:17px;letter-spacing:.04em;color:var(--green)}nav button{border:0;background:transparent;color:#63726b;text-align:left;padding:15px 18px;border-radius:12px;font-weight:700}nav button:nth-child(1):before{content:'▦  ';font-size:18px}nav button:nth-child(2):before{content:'▤  ';font-size:18px}nav button:nth-child(3):before{content:'⚙  ';font-size:18px}nav button:nth-child(4):before{content:'◫  ';font-size:18px}nav button.selected{background:var(--light);color:var(--green)}#logout{position:fixed;bottom:24px;left:24px;width:218px;z-index:7;background:#f5f7f5;border:1px solid #e1e8e2;color:#66786b;border-radius:11px;padding:13px;font-weight:700}#productsTab,#ordersTab,#settingsTab,#dashboardTab{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px 32px;box-shadow:var(--shadow);max-width:1180px;margin:0 auto}#productsTab{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1fr);column-gap:35px;align-items:start}#productsTab>h2:first-child{grid-column:1}#productForm{grid-column:1;grid-row:2 / span 2}#productsTab>h2:nth-of-type(2){grid-column:2;grid-row:1}#list{grid-column:2;grid-row:2 / span 2;min-width:0}.row{border:1px solid var(--line);border-radius:13px;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;font-size:13px}.row>span:first-child{min-width:0;overflow-wrap:anywhere}.row>span:last-child{display:flex;gap:6px;flex-shrink:0}.row button{padding:8px 11px;font-size:12px}.danger{background:#b44b4b!important}.muted{color:var(--muted)}.order{border:1px solid var(--line);border-radius:15px;padding:20px;margin:12px 0}.order select{max-width:240px}.stat{display:inline-flex;flex-direction:column;min-width:170px;background:#f5faf6;border:1px solid #e3eee5;border-radius:16px;padding:22px;margin:5px 12px 8px 0}.stat b{font-size:34px;font-family:Manrope;color:var(--green)}.stat p{margin:0;color:#718078}#login{max-width:480px;margin:65px auto;background:white;padding:40px;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}#login h2{margin-bottom:20px}#login .muted{font-size:12px;margin-top:20px}#settingsForm{max-width:700px}#settingsForm label{font-size:13px}#settingsForm button{margin-top:10px}
@media(max-width:1100px){body{padding-left:265px;padding-right:20px}#panel>nav{width:235px}#logout{width:190px}#productsTab{grid-template-columns:1fr}#productsTab>h2:first-child,#productForm,#productsTab>h2:nth-of-type(2),#list{grid-column:1;grid-row:auto}#productsTab>h2:nth-of-type(2){margin-top:35px}}
@media(max-width:720px){body{padding:0 14px 85px}body>h1{padding-top:25px;font-size:25px}#panel>nav{position:sticky;top:0;width:auto;flex-direction:row;overflow-x:auto;padding:10px 0;margin:0 0 18px;background:var(--bg);border:0;gap:4px}#panel>nav:before{display:none}nav button{padding:11px 12px;white-space:nowrap;font-size:12px}#logout{position:static;width:auto;display:block;margin:14px 0 8px auto;padding:9px 16px}#productsTab,#ordersTab,#settingsTab,#dashboardTab{padding:22px 17px;border-radius:17px}.row{flex-wrap:wrap}.row>span:last-child{margin-left:auto}#login{margin:40px auto;padding:25px}}
</style></head><body><h1>NOVA SHOP / ADMIN</h1><p class="muted">Зөвхөн зөвшөөрөгдсөн админ бараа удирдана.</p><p id="msg" role="status"></p><section id="login"><h2>Нэвтрэх</h2><form id="loginForm"><input id="email" type="email" placeholder="Имэйл" required><input id="password" type="password" placeholder="Нууц үг" required><button>Нэвтрэх</button></form><p class="muted">Эхлээд Supabase Authentication-д хэрэглэгч үүсгээд shop_admins хүснэгтэд эрх олгоно.</p></section><section id="panel"><button id="logout">Гарах</button><nav><button type="button" class="selected" data-tab="products">Бараа</button><button type="button" data-tab="orders">Захиалга</button><button type="button" data-tab="settings">Сайтын тохиргоо</button><button type="button" data-tab="dashboard">Тойм</button></nav><div id="productsTab"><h2>Бараа нэмэх / засах</h2><form id="productForm"><input type="hidden" id="pid"><input id="name" placeholder="Барааны нэр" required maxlength="160"><input id="category" placeholder="Ангилал" required><input id="price" type="number" min="0" step="1" placeholder="Үнэ ₮" required><input id="stock" type="number" min="0" step="1" placeholder="Үлдэгдэл" required><label>Үндсэн зураг upload (JPG, PNG, WEBP, GIF · 5MB хүртэл)<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><img id="imagePreview" alt="Барааны зураг" hidden style="width:160px;max-height:210px;object-fit:cover;border-radius:10px"><input id="image" type="url" placeholder="Эсвэл зургийн https:// URL"><label>Хэмжээ (таслалаар тусгаарла: XS, S, M, L, XL)<input id="sizes" placeholder="S, M, L, XL"></label><label>Өнгө (таслалаар тусгаарла)<input id="colors" placeholder="Хар, Цагаан, Саарал"></label><label>Нэмэлт зураг upload (олныг сонгож болно)<input id="galleryFiles" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif"></label><label>Нэмэлт зургууд (URL-уудыг таслалаар)<textarea id="gallery" rows="3" placeholder="https://..., https://..."></textarea></label><label>Барааны тайлбар<textarea id="description" rows="3" placeholder="Материал, загвар, арчилгаа..."></textarea></label><label><input id="active" type="checkbox" checked> Нийтэд харагдах</label><button>Хадгалах</button><button type="button" id="reset">Шинэ бараа</button></form><h2>Бараанууд</h2><div id="list"></div></div><div id="ordersTab" hidden><h2>Захиалгууд</h2><div id="ordersList"></div></div><div id="settingsTab" hidden><h2>Сайтын тохиргоо</h2><form id="settingsForm" class="wide"><label>Дэлгүүрийн нэр<input id="setBrand" required></label><label>Дээд зарлал<input id="setAnnouncement"></label><label>Нүүр хуудасны гарчиг<input id="setTitle" required></label><label>Нүүр хуудасны тайлбар<textarea id="setSubtitle" rows="3"></textarea></label><label>Нүүр зураг URL<input id="setImage" type="url"></label><label>Утас<input id="setPhone"></label><label>Имэйл<input id="setEmail" type="email"></label><label>Instagram холбоос<input id="setInstagram" type="url"></label><label>Хүргэлтийн мэдээлэл<textarea id="setShipping"></textarea></label><button>Тохиргоо хадгалах</button></form></div><div id="dashboardTab" hidden><h2>Дэлгүүрийн тойм</h2><div id="stats"></div></div></section><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/+esm';
const db=createClient('https://gruqmpkyvwpleonnqifn.supabase.co','sb_publishable_IfNr86IUpKiCkYt-2xQfsg_pH9HDGUc');const $=x=>document.getElementById(x),msg=s=>$('msg').textContent=s;let products=[];function reset(){ $('productForm').reset();$('pid').value='';$('active').checked=true;$('imagePreview').hidden=true;$('imagePreview').removeAttribute('src') }async function init(){let {data:{user}}=await db.auth.getUser();if(!user){$('login').style.display='block';$('panel').style.display='none';return}let {data,error}=await db.from('shop_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){msg('Энэ хэрэглэгчид админ эрх олгоогүй байна.');$('login').style.display='block';$('panel').style.display='none';return}$('login').style.display='none';$('panel').style.display='block';await load()}async function load(){let {data,error}=await db.from('shop_products').select('*').order('id',{ascending:false});if(error){msg(error.message);return}products=data||[];$('list').replaceChildren(...products.map(p=>{let row=document.createElement('div');row.className='row';let label=document.createElement('span');label.textContent=p.name+' · '+p.price_mnt.toLocaleString()+'₮ · '+p.stock+' ш · '+(p.sizes||[]).join("/") + ' · '+(p.colors||[]).join("/");let actions=document.createElement('span');let edit=document.createElement('button');edit.textContent='Засах';edit.onclick=()=>{ $('pid').value=p.id;$('name').value=p.name;$('category').value=p.category;$('price').value=p.price_mnt;$('stock').value=p.stock;$('image').value=p.image_url||'';$('sizes').value=(p.sizes||[]).join(', ');$('colors').value=(p.colors||[]).join(', ');$('gallery').value=(p.gallery||[]).join(', ');$('description').value=p.description||'';$('active').checked=p.active;$('imagePreview').hidden=!p.image_url;if(p.image_url)$('imagePreview').src=p.image_url;$('imageFile').value='';$('galleryFiles').value='';window.scrollTo(0,0)};let del=document.createElement('button');del.className='danger';del.textContent='Устгах';del.onclick=async()=>{if(!confirm(p.name+' барааг устгах уу?'))return;let {error}=await db.from('shop_products').delete().eq('id',p.id);if(error)msg(error.message);else await load()};actions.append(edit,del);row.append(label,actions);return row}))}
$('loginForm').onsubmit=async e=>{e.preventDefault();let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)msg(error.message);else{msg('Амжилттай нэвтэрлээ');await init()}};
$('imageFile').onchange=()=>{let f=$('imageFile').files[0];if(!f){$('imagePreview').hidden=true;return}if(!f.type.startsWith('image/'))return;let url=URL.createObjectURL(f);$('imagePreview').src=url;$('imagePreview').hidden=false;$('imagePreview').onload=()=>URL.revokeObjectURL(url)};
async function uploadImage(file){const allowed=['image/jpeg','image/png','image/webp','image/gif'];if(!allowed.includes(file.type))throw Error('Зөвхөн JPG, PNG, WEBP, GIF зураг оруулна.');if(file.size>5*1024*1024)throw Error('Зургийн хэмжээ 5MB-аас бага байх ёстой.');const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'}[file.type];const {data:{user},error:authError}=await db.auth.getUser();if(authError||!user)throw Error('Админ эрхээр дахин нэвтэрнэ үү.');const path=user.id+'/'+crypto.randomUUID()+'.'+ext;const {error}=await db.storage.from('shop-images').upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;return db.storage.from('shop-images').getPublicUrl(path).data.publicUrl}
$('productForm').onsubmit=async e=>{e.preventDefault();let submit=$('productForm').querySelector('button[type="submit"]')||$('productForm').querySelector('button');submit.disabled=true;msg('Зураг болон барааг хадгалж байна...');try{let main=$('imageFile').files[0];if(main)$('image').value=await uploadImage(main);let extras=Array.from($('galleryFiles').files);if(extras.length){let uploaded=[];for(let file of extras)uploaded.push(await uploadImage(file));$('gallery').value=[$('gallery').value,...uploaded].filter(Boolean).join(', ')} }catch(err){msg('Зураг upload алдаа: '+err.message);submit.disabled=false;return}submit.disabled=false;let p={name:$('name').value.trim(),category:$('category').value.trim(),price_mnt:Number($('price').value),stock:Number($('stock').value),image_url:$('image').value||null,sizes:$('sizes').value.split(',').map(x=>x.trim()).filter(Boolean),colors:$('colors').value.split(',').map(x=>x.trim()).filter(Boolean),gallery:$('gallery').value.split(',').map(x=>x.trim()).filter(Boolean),description:$('description').value.trim(),active:$('active').checked};let id=$('pid').value;let q=id?db.from('shop_products').update(p).eq('id',Number(id)):db.from('shop_products').insert(p);let {error}=await q;if(error)msg(error.message);else{msg('Бараа хадгалагдлаа');reset();await load()}};
$('reset').onclick=reset;$('logout').onclick=async()=>{await db.auth.signOut();await init()};
const tabs=['products','orders','settings','dashboard'];document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{tabs.forEach(t=>$(t+'Tab').hidden=t!==b.dataset.tab);document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('selected',x===b));if(b.dataset.tab==='orders')await loadOrders();if(b.dataset.tab==='settings')await loadSettings();if(b.dataset.tab==='dashboard')await loadStats()});
async function loadSettings(){let {data,error}=await db.from('shop_settings').select('*').eq('id',1).single();if(error){msg(error.message);return}const fields={setBrand:'brand',setAnnouncement:'announcement',setTitle:'hero_title',setSubtitle:'hero_subtitle',setImage:'hero_image',setPhone:'contact_phone',setEmail:'contact_email',setInstagram:'instagram',setShipping:'shipping_text'};for(let [id,key]of Object.entries(fields))$(id).value=data[key]||''}
$('settingsForm').onsubmit=async e=>{e.preventDefault();let data={brand:$('setBrand').value.trim(),announcement:$('setAnnouncement').value,hero_title:$('setTitle').value.trim(),hero_subtitle:$('setSubtitle').value,hero_image:$('setImage').value||null,contact_phone:$('setPhone').value,contact_email:$('setEmail').value,instagram:$('setInstagram').value,shipping_text:$('setShipping').value,updated_at:new Date().toISOString()};let {error}=await db.from('shop_settings').update(data).eq('id',1);msg(error?error.message:'Сайтын тохиргоо хадгалагдлаа')};
async function loadOrders(){let {data,error}=await db.from('shop_orders').select('*').order('created_at',{ascending:false}).limit(200);if(error){msg(error.message);return}$('ordersList').replaceChildren(...(data||[]).map(o=>{let card=document.createElement('div');card.className='order';let title=document.createElement('h3');title.textContent='#'+o.id+' · '+o.customer_name+' · '+Number(o.total_mnt).toLocaleString()+'₮';let info=document.createElement('p');info.textContent=o.phone+' · '+o.address;let lines=document.createElement('p');lines.textContent=(o.items||[]).map(i=>i.name+' × '+i.qty).join(' / ');let date=document.createElement('p');date.className='muted';date.textContent=new Date(o.created_at).toLocaleString('mn-MN')+' · Захиалгын хүсэлт (төлбөр баталгаажаагүй)';let sel=document.createElement('select');for(let [value,label]of Object.entries({new:'Шинэ',confirmed:'Баталгаажсан',shipped:'Илгээсэн',done:'Дууссан',cancelled:'Цуцалсан'})){let op=document.createElement('option');op.value=value;op.textContent=label;sel.append(op)}sel.value=o.status;sel.onchange=async()=>{let {error}=await db.from('shop_orders').update({status:sel.value}).eq('id',o.id);msg(error?error.message:'Захиалгын төлөв шинэчлэгдлээ')};card.append(title,info,lines,date,sel);return card}));if(!data?.length)$('ordersList').textContent='Захиалга алга'}
async function loadStats(){let [p,o]=await Promise.all([db.from('shop_products').select('id,active,stock'),db.from('shop_orders').select('id,status,total_mnt')]);if(p.error||o.error){msg(p.error?.message||o.error?.message);return}let products=p.data||[],orders=o.data||[];let values=[['Нийт бараа',products.length],['Идэвхтэй бараа',products.filter(x=>x.active).length],['Шинэ захиалга',orders.filter(x=>x.status==='new').length],['Нийт захиалга',orders.length]];$('stats').replaceChildren(...values.map(([label,value])=>{let x=document.createElement('div');x.className='stat';let b=document.createElement('b');b.textContent=value;let p=document.createElement('p');p.textContent=label;x.append(b,p);return x}))}
init();
</script></body></html>
