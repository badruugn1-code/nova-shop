<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA SHOP · Admin</title><style>body{font:15px Arial,sans-serif;max-width:920px;margin:40px auto;padding:0 20px;color:#171717}input,button,select{padding:12px;margin:6px 0;border:1px solid #ccc;font:inherit}button{background:#171717;color:white;cursor:pointer}input{max-width:100%;box-sizing:border-box}form{display:grid;gap:8px;max-width:460px}.row{padding:14px 0;border-bottom:1px solid #ddd;display:flex;gap:12px;justify-content:space-between;align-items:center}.muted{color:#777}.danger{background:#a22}#panel{display:none}#msg{min-height:24px}</style></head><body><h1>NOVA SHOP / ADMIN</h1><p class="muted">Зөвхөн зөвшөөрөгдсөн админ бараа удирдана.</p><p id="msg" role="status"></p><section id="login"><h2>Нэвтрэх</h2><form id="loginForm"><input id="email" type="email" placeholder="Имэйл" required><input id="password" type="password" placeholder="Нууц үг" required><button>Нэвтрэх</button></form><p class="muted">Эхлээд Supabase Authentication-д хэрэглэгч үүсгээд shop_admins хүснэгтэд эрх олгоно.</p></section><section id="panel"><button id="logout">Гарах</button><h2>Бараа нэмэх / засах</h2><form id="productForm"><input type="hidden" id="pid"><input id="name" placeholder="Барааны нэр" required maxlength="160"><input id="category" placeholder="Ангилал" required><input id="price" type="number" min="0" step="1" placeholder="Үнэ ₮" required><input id="stock" type="number" min="0" step="1" placeholder="Үлдэгдэл" required><input id="image" type="url" placeholder="Зургийн https:// URL"><label><input id="active" type="checkbox" checked> Нийтэд харагдах</label><button>Хадгалах</button><button type="button" id="reset">Шинэ бараа</button></form><h2>Бараанууд</h2><div id="list"></div></section><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/+esm';
const db=createClient('https://gruqmpkyvwpleonnqifn.supabase.co','sb_publishable_IfNr86IUpKiCkYt-2xQfsg_pH9HDGUc');const $=x=>document.getElementById(x),msg=s=>$('msg').textContent=s;let products=[];function reset(){ $('productForm').reset();$('pid').value='';$('active').checked=true }async function init(){let {data:{user}}=await db.auth.getUser();if(!user){$('login').style.display='block';$('panel').style.display='none';return}let {data,error}=await db.from('shop_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){msg('Энэ хэрэглэгчид админ эрх олгоогүй байна.');$('login').style.display='block';$('panel').style.display='none';return}$('login').style.display='none';$('panel').style.display='block';await load()}async function load(){let {data,error}=await db.from('shop_products').select('*').order('id',{ascending:false});if(error){msg(error.message);return}products=data||[];$('list').replaceChildren(...products.map(p=>{let row=document.createElement('div');row.className='row';let label=document.createElement('span');label.textContent=p.name+' · '+p.price_mnt.toLocaleString()+'₮ · '+p.stock+' ш';let actions=document.createElement('span');let edit=document.createElement('button');edit.textContent='Засах';edit.onclick=()=>{ $('pid').value=p.id;$('name').value=p.name;$('category').value=p.category;$('price').value=p.price_mnt;$('stock').value=p.stock;$('image').value=p.image_url||'';$('active').checked=p.active;window.scrollTo(0,0)};let del=document.createElement('button');del.className='danger';del.textContent='Устгах';del.onclick=async()=>{if(!confirm(p.name+' барааг устгах уу?'))return;let {error}=await db.from('shop_products').delete().eq('id',p.id);if(error)msg(error.message);else await load()};actions.append(edit,del);row.append(label,actions);return row}))}
$('loginForm').onsubmit=async e=>{e.preventDefault();let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)msg(error.message);else{msg('Амжилттай нэвтэрлээ');await init()}};
$('productForm').onsubmit=async e=>{e.preventDefault();let p={name:$('name').value.trim(),category:$('category').value.trim(),price_mnt:Number($('price').value),stock:Number($('stock').value),image_url:$('image').value||null,active:$('active').checked};let id=$('pid').value;let q=id?db.from('shop_products').update(p).eq('id',Number(id)):db.from('shop_products').insert(p);let {error}=await q;if(error)msg(error.message);else{msg('Бараа хадгалагдлаа');reset();await load()}};
$('reset').onclick=reset;$('logout').onclick=async()=>{await db.auth.signOut();await init()};init();
</script></body></html>
