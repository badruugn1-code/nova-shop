<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA SHOP · Admin</title><style>body{font:15px Arial,sans-serif;max-width:920px;margin:40px auto;padding:0 20px;color:#171717}input,button,select{padding:12px;margin:6px 0;border:1px solid #ccc;font:inherit}button{background:#171717;color:white;cursor:pointer}input{max-width:100%;box-sizing:border-box}textarea{font:inherit;padding:12px;border:1px solid #ccc}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}nav button{background:white;color:#111}nav button.selected{background:#111;color:white}.stat{display:inline-block;padding:20px;border:1px solid #ddd;margin:8px 8px 8px 0}.wide{max-width:700px}.order{border:1px solid #ddd;padding:18px;margin:12px 0}form{display:grid;gap:8px;max-width:460px}.row{padding:14px 0;border-bottom:1px solid #ddd;display:flex;gap:12px;justify-content:space-between;align-items:center}.muted{color:#777}.danger{background:#a22}#panel{display:none}#msg{min-height:24px}</style></head><body><h1>NOVA SHOP / ADMIN</h1><p class="muted">Зөвхөн зөвшөөрөгдсөн админ бараа удирдана.</p><p id="msg" role="status"></p><section id="login"><h2>Нэвтрэх</h2><form id="loginForm"><input id="email" type="email" placeholder="Имэйл" required><input id="password" type="password" placeholder="Нууц үг" required><button>Нэвтрэх</button></form><p class="muted">Эхлээд Supabase Authentication-д хэрэглэгч үүсгээд shop_admins хүснэгтэд эрх олгоно.</p></section><section id="panel"><button id="logout">Гарах</button><nav><button type="button" class="selected" data-tab="products">Бараа</button><button type="button" data-tab="orders">Захиалга</button><button type="button" data-tab="settings">Сайтын тохиргоо</button><button type="button" data-tab="dashboard">Тойм</button></nav><div id="productsTab"><h2>Бараа нэмэх / засах</h2><form id="productForm"><input type="hidden" id="pid"><input id="name" placeholder="Барааны нэр" required maxlength="160"><input id="category" placeholder="Ангилал" required><input id="price" type="number" min="0" step="1" placeholder="Үнэ ₮" required><input id="stock" type="number" min="0" step="1" placeholder="Үлдэгдэл" required><input id="image" type="url" placeholder="Зургийн https:// URL"><label><input id="active" type="checkbox" checked> Нийтэд харагдах</label><button>Хадгалах</button><button type="button" id="reset">Шинэ бараа</button></form><h2>Бараанууд</h2><div id="list"></div></div><div id="ordersTab" hidden><h2>Захиалгууд</h2><div id="ordersList"></div></div><div id="settingsTab" hidden><h2>Сайтын тохиргоо</h2><form id="settingsForm" class="wide"><label>Дэлгүүрийн нэр<input id="setBrand" required></label><label>Дээд зарлал<input id="setAnnouncement"></label><label>Нүүр хуудасны гарчиг<input id="setTitle" required></label><label>Нүүр хуудасны тайлбар<textarea id="setSubtitle" rows="3"></textarea></label><label>Нүүр зураг URL<input id="setImage" type="url"></label><label>Утас<input id="setPhone"></label><label>Имэйл<input id="setEmail" type="email"></label><label>Instagram холбоос<input id="setInstagram" type="url"></label><label>Хүргэлтийн мэдээлэл<textarea id="setShipping"></textarea></label><button>Тохиргоо хадгалах</button></form></div><div id="dashboardTab" hidden><h2>Дэлгүүрийн тойм</h2><div id="stats"></div></div></section><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/+esm';
const db=createClient('https://gruqmpkyvwpleonnqifn.supabase.co','sb_publishable_IfNr86IUpKiCkYt-2xQfsg_pH9HDGUc');const $=x=>document.getElementById(x),msg=s=>$('msg').textContent=s;let products=[];function reset(){ $('productForm').reset();$('pid').value='';$('active').checked=true }async function init(){let {data:{user}}=await db.auth.getUser();if(!user){$('login').style.display='block';$('panel').style.display='none';return}let {data,error}=await db.from('shop_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){msg('Энэ хэрэглэгчид админ эрх олгоогүй байна.');$('login').style.display='block';$('panel').style.display='none';return}$('login').style.display='none';$('panel').style.display='block';await load()}async function load(){let {data,error}=await db.from('shop_products').select('*').order('id',{ascending:false});if(error){msg(error.message);return}products=data||[];$('list').replaceChildren(...products.map(p=>{let row=document.createElement('div');row.className='row';let label=document.createElement('span');label.textContent=p.name+' · '+p.price_mnt.toLocaleString()+'₮ · '+p.stock+' ш';let actions=document.createElement('span');let edit=document.createElement('button');edit.textContent='Засах';edit.onclick=()=>{ $('pid').value=p.id;$('name').value=p.name;$('category').value=p.category;$('price').value=p.price_mnt;$('stock').value=p.stock;$('image').value=p.image_url||'';$('active').checked=p.active;window.scrollTo(0,0)};let del=document.createElement('button');del.className='danger';del.textContent='Устгах';del.onclick=async()=>{if(!confirm(p.name+' барааг устгах уу?'))return;let {error}=await db.from('shop_products').delete().eq('id',p.id);if(error)msg(error.message);else await load()};actions.append(edit,del);row.append(label,actions);return row}))}
$('loginForm').onsubmit=async e=>{e.preventDefault();let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)msg(error.message);else{msg('Амжилттай нэвтэрлээ');await init()}};
$('productForm').onsubmit=async e=>{e.preventDefault();let p={name:$('name').value.trim(),category:$('category').value.trim(),price_mnt:Number($('price').value),stock:Number($('stock').value),image_url:$('image').value||null,active:$('active').checked};let id=$('pid').value;let q=id?db.from('shop_products').update(p).eq('id',Number(id)):db.from('shop_products').insert(p);let {error}=await q;if(error)msg(error.message);else{msg('Бараа хадгалагдлаа');reset();await load()}};
$('reset').onclick=reset;$('logout').onclick=async()=>{await db.auth.signOut();await init()};
const tabs=['products','orders','settings','dashboard'];document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{tabs.forEach(t=>$(t+'Tab').hidden=t!==b.dataset.tab);document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('selected',x===b));if(b.dataset.tab==='orders')await loadOrders();if(b.dataset.tab==='settings')await loadSettings();if(b.dataset.tab==='dashboard')await loadStats()});
async function loadSettings(){let {data,error}=await db.from('shop_settings').select('*').eq('id',1).single();if(error){msg(error.message);return}const fields={setBrand:'brand',setAnnouncement:'announcement',setTitle:'hero_title',setSubtitle:'hero_subtitle',setImage:'hero_image',setPhone:'contact_phone',setEmail:'contact_email',setInstagram:'instagram',setShipping:'shipping_text'};for(let [id,key]of Object.entries(fields))$(id).value=data[key]||''}
$('settingsForm').onsubmit=async e=>{e.preventDefault();let data={brand:$('setBrand').value.trim(),announcement:$('setAnnouncement').value,hero_title:$('setTitle').value.trim(),hero_subtitle:$('setSubtitle').value,hero_image:$('setImage').value||null,contact_phone:$('setPhone').value,contact_email:$('setEmail').value,instagram:$('setInstagram').value,shipping_text:$('setShipping').value,updated_at:new Date().toISOString()};let {error}=await db.from('shop_settings').update(data).eq('id',1);msg(error?error.message:'Сайтын тохиргоо хадгалагдлаа')};
async function loadOrders(){let {data,error}=await db.from('shop_orders').select('*').order('created_at',{ascending:false}).limit(200);if(error){msg(error.message);return}$('ordersList').replaceChildren(...(data||[]).map(o=>{let card=document.createElement('div');card.className='order';let title=document.createElement('h3');title.textContent='#'+o.id+' · '+o.customer_name+' · '+Number(o.total_mnt).toLocaleString()+'₮';let info=document.createElement('p');info.textContent=o.phone+' · '+o.address;let lines=document.createElement('p');lines.textContent=(o.items||[]).map(i=>i.name+' × '+i.qty).join(' / ');let date=document.createElement('p');date.className='muted';date.textContent=new Date(o.created_at).toLocaleString('mn-MN')+' · Захиалгын хүсэлт (төлбөр баталгаажаагүй)';let sel=document.createElement('select');for(let [value,label]of Object.entries({new:'Шинэ',confirmed:'Баталгаажсан',shipped:'Илгээсэн',done:'Дууссан',cancelled:'Цуцалсан'})){let op=document.createElement('option');op.value=value;op.textContent=label;sel.append(op)}sel.value=o.status;sel.onchange=async()=>{let {error}=await db.from('shop_orders').update({status:sel.value}).eq('id',o.id);msg(error?error.message:'Захиалгын төлөв шинэчлэгдлээ')};card.append(title,info,lines,date,sel);return card}));if(!data?.length)$('ordersList').textContent='Захиалга алга'}
async function loadStats(){let [p,o]=await Promise.all([db.from('shop_products').select('id,active,stock'),db.from('shop_orders').select('id,status,total_mnt')]);if(p.error||o.error){msg(p.error?.message||o.error?.message);return}let products=p.data||[],orders=o.data||[];let values=[['Нийт бараа',products.length],['Идэвхтэй бараа',products.filter(x=>x.active).length],['Шинэ захиалга',orders.filter(x=>x.status==='new').length],['Нийт захиалга',orders.length]];$('stats').replaceChildren(...values.map(([label,value])=>{let x=document.createElement('div');x.className='stat';let b=document.createElement('b');b.textContent=value;let p=document.createElement('p');p.textContent=label;x.append(b,p);return x}))}
init();
</script></body></html>
